/* Hallmark · waive 39b · button.lcard, four leader cards at 250px · each card is a whole leader you pick, with name, chamber and starting odds, so the card itself is the hit target */
/* Hallmark · dismissed F21 · the Scenario h3 sits inside scenPicker, defined above the title template in the script; on the page it follows the h2 Choose your leader */
/* Hallmark · dismissed F4 · .btn is the cotton index card the theme presses every choice from, .seg button.on is the chosen card in its groove; the ink board .btn.big is the one filled primary on any screen */
/* Hallmark · dismissed F7 · the thirteen stock selectors are the one cotton material the theme prints on; roles split by what sits on the card (race rows, memos, leader cards), not by a new box per role */

/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
  --text-2xs: 0.6875rem; --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem; --text-4xl: 2.488rem;
  --text-display: 2.074rem; --text-section: 1.2rem; --text-title: 1rem;
  --text-wordmark: clamp(4.75rem, 18vw, 9.5rem);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400; --z-toast: 500; --z-tooltip: 600;
  --container: 1040px; --gutter: 16px;
  --color-paper: oklch(97% 0.006 55); --color-paper-2: oklch(94.5% 0.007 55); --color-paper-3: oklch(91.5% 0.009 55);
  --color-ink: oklch(21% 0.012 38); --color-ink-2: oklch(29% 0.013 40); --color-muted: oklch(47% 0.013 45);
  --color-rule: oklch(87% 0.009 55); --color-rule-2: oklch(81% 0.011 55);
  --color-accent: oklch(74% 0.125 30); --color-accent-ink: oklch(21% 0.012 38); --color-accent-2: oklch(54% 0.165 29); --color-focus: oklch(54% 0.17 30);
  --color-cotton: oklch(98.8% 0.0045 80); --color-desk: oklch(94.3% 0.008 64); --color-print: oklch(23% 0.012 38);
  --color-board: oklch(22% 0.011 40); --color-board-type: oklch(96.5% 0.006 70); --color-board-muted: oklch(78% 0.01 60); --color-paid: oklch(55.5% 0.15 33);
  --color-good: oklch(47% 0.09 150); --color-bad: oklch(49% 0.12 52);
  --color-scrim: oklch(21% 0.012 38 / 0.45);
  /* the two parties: data, never a signal */
  --dem: oklch(47% 0.135 258); --dem-2: oklch(66% 0.1 258); --dem-bg: oklch(91.5% 0.03 258); --dem-ink: oklch(98.8% 0.0045 80);
  --rep: oklch(49.5% 0.165 25); --rep-2: oklch(69% 0.11 25); --rep-bg: oklch(92% 0.032 25); --rep-ink: oklch(98.8% 0.0045 80);
  --likely-ink: oklch(21% 0.012 38);
  /* the share card is always printed light; hex so the canvas reads it */
  --card-paper: #F6F3F0; --card-ink: #2A211D; --card-muted: #6E625B; --card-dem: #2F5CB0; --card-rep: #B83A35; --card-rule: #D9D2CC;
  --font-display: "Albert Sans", ui-sans-serif, system-ui, sans-serif; --font-body: var(--font-display);
  --font-outlier: "Geist Mono", ui-monospace, monospace;
  --radius-card: 8px; --radius-input: 6px; --radius-groove: 12px; --radius-stock: 8px; --radius-chip: 4px; --rule-hair: 1px;
  --shade: 32% 0.03 50; --lit: 100% 0.005 80; --deep: 7% 0.01 40;
  --edge-stock: inset 0 1px 0 oklch(var(--lit) / 0.9), inset 0 -1px 0 oklch(var(--shade) / 0.07), 0 0 0 0.5px oklch(var(--shade) / 0.22), 0 1px 0 oklch(var(--shade) / 0.12);
  --cast-stock: 6px 5px 10px -6px oklch(var(--shade) / 0.3); --cast-stock-lift: 12px 10px 18px -8px oklch(var(--shade) / 0.3);
  --press-groove: inset 1px 1.5px 2px oklch(var(--shade) / 0.16), inset -1px -1px 0 oklch(var(--lit) / 0.9), 0 0 0 0.5px oklch(var(--shade) / 0.2);
  --press-text: 0.5px 0.75px 0 oklch(var(--lit) / 0.9);

  --tracking-display: -0.03em; --display-weight: 600;

  color-scheme: dark;
  --color-paper: oklch(16.5% 0.009 50); --color-paper-2: oklch(19.5% 0.01 50); --color-paper-3: oklch(22.5% 0.011 50);
  --color-ink: oklch(94% 0.008 70); --color-ink-2: oklch(85% 0.009 65); --color-muted: oklch(73% 0.012 55);
  --color-rule: oklch(30% 0.012 50); --color-rule-2: oklch(37% 0.013 50);
  --color-accent: oklch(78% 0.1 30); --color-accent-ink: oklch(16.5% 0.009 50); --color-accent-2: oklch(73% 0.12 30); --color-focus: oklch(75% 0.12 30);
  --color-cotton: oklch(21.5% 0.01 55); --color-desk: oklch(18% 0.01 55); --color-print: oklch(94% 0.008 70);
  --color-board: oklch(89% 0.012 65); --color-board-type: oklch(17% 0.009 50); --color-board-muted: oklch(40% 0.01 60); --color-paid: oklch(74% 0.12 33);
  --color-good: oklch(75% 0.1 150); --color-bad: oklch(76% 0.1 55);
  --color-scrim: oklch(8% 0.008 50 / 0.62);
  --dem: oklch(70% 0.11 258); --dem-2: oklch(52% 0.1 258); --dem-bg: oklch(29% 0.055 258); --dem-ink: oklch(16.5% 0.009 50);
  --rep: oklch(70% 0.13 25); --rep-2: oklch(53% 0.12 25); --rep-bg: oklch(30% 0.06 25); --rep-ink: oklch(16.5% 0.009 50);
  --likely-ink: oklch(97% 0.006 70);
  --edge-stock: inset 0 0 0 1px oklch(33% 0.012 50); --cast-stock: 0 0 0 0 transparent; --cast-stock-lift: inset 0 0 0 1px oklch(42% 0.013 50);
  --press-groove: inset 0 0 0 1px oklch(30% 0.012 50); --press-text: 0 0 0 transparent;
  --tex-cotton: none;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-md)/1.55 var(--font-body); -webkit-font-smoothing: antialiased; caret-color: var(--color-focus); -webkit-tap-highlight-color: transparent; }
::selection { background: color-mix(in oklab, var(--color-accent) 30%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.08; color: var(--color-ink); overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
b, strong { font-weight: 600; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
a:hover { text-decoration-color: var(--color-accent-2); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
.num, td.num, .fig { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--color-muted); }
.small { font-size: var(--text-sm); }
.dem, .dem-t { color: var(--dem); }
.rep, .rep-t { color: var(--rep); }
.up { color: var(--color-good); }
.dn, .bad-t { color: var(--color-bad); }
.row { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.list { margin: 0; padding-left: var(--space-md); display: grid; gap: var(--space-2xs); }

/* ---------- the stock: cotton paper lit from the left ---------- */
.stock, .opt, .rcard, .mrow, .event, .lcard, .icard, .tcard, .result, .dlg-in, .needle-wrap, .tip {
  background-color: var(--color-cotton);
  background-image: linear-gradient(100deg, var(--color-cotton), transparent 45%), var(--tex-cotton);
  color: var(--color-print);
  border-radius: var(--radius-card);
  box-shadow: var(--edge-stock), var(--cast-stock);
}

/* ---------- top bar ---------- */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-sticky-nav); background: var(--color-paper); box-shadow: 0 var(--rule-hair) 0 var(--color-rule); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: var(--z-sticky-nav); background: var(--color-paper); }
.tb-in { max-width: var(--container); margin: 0 auto; display: flex; align-items: center; gap: var(--space-md); min-height: 56px; padding-block: var(--space-xs); padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.wordmark { font: 600 var(--text-lg)/1 var(--font-display); letter-spacing: -0.02em; white-space: nowrap; }
.wordmark i { font-style: normal; font-weight: 400; color: var(--color-muted); padding: 0 var(--space-3xs); }
.who { display: grid; line-height: 1.25; min-width: 0; }
.who b { font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }

.tb-sp { flex: 1; }
.stat { display: grid; justify-items: end; line-height: 1.15; position: relative; }
.stat small { font-size: var(--text-xs); color: var(--color-muted); }
.stat b { font: 400 var(--text-lg)/1.1 var(--font-outlier); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.flash { position: absolute; top: 100%; right: 0; font: 400 var(--text-xs)/1.2 var(--font-outlier); color: var(--color-ink-2); font-style: normal; white-space: nowrap; animation: flash 1.6s var(--ease-out) forwards; }
@keyframes flash { 0% { opacity: 0; transform: translateY(-4px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
[data-anim="off"] .flash { animation: none; opacity: 0; }
.menu { max-width: var(--container); margin: 0 auto; display: flex; flex-wrap: wrap; gap: var(--space-xs); padding-block: 0 var(--space-sm); padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.confirm { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-card); box-shadow: var(--press-groove); background: var(--color-paper-2); }
@media (max-width: 560px) { .who { display: none; } .tb-in { gap: var(--space-sm); } .stat b { font-size: var(--text-md); } }

#prog { max-width: var(--container); margin: 0 auto; }
.prog-in { padding-block: var(--space-sm) 0; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); font-size: var(--text-xs); color: var(--color-muted); display: grid; gap: var(--space-xs); }
.prog-bar { height: 4px; border-radius: var(--radius-chip); background: var(--color-paper-3); box-shadow: var(--press-groove); overflow: hidden; }
.prog-bar i { display: block; height: 100%; width: 100%; background: var(--color-ink); transform-origin: left center; }

/* ---------- the working column ---------- */
main { max-width: var(--container); margin: 0 auto; padding-block: var(--space-lg) 140px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); display: grid; gap: var(--space-lg); }
main > * { min-width: 0; }
.sh { display: grid; gap: var(--space-xs); padding-top: var(--space-xs); }
.sh h1 { font-size: var(--text-display); max-width: 24ch; }
.when { font-size: var(--text-sm); color: var(--color-muted); }
.lede { max-width: 62ch; color: var(--color-ink-2); font-size: var(--text-md); }
.lede b { color: var(--color-ink); }
.h2 { font-size: var(--text-2xl); }
.h3 { font-size: var(--text-section); margin-bottom: var(--space-xs); }
.ph { font-size: var(--text-section); }
.ph3 { font-size: var(--text-md); margin-top: var(--space-sm); }
/* plain sections: a hairline over a head; no box */
.panel { display: grid; gap: var(--space-sm); padding-top: var(--space-md); border-top: var(--rule-hair) solid var(--color-rule); }
.panel.shift { padding: var(--space-md); border: 0; border-radius: var(--radius-card); background: var(--color-paper-2); color: var(--color-ink); box-shadow: var(--press-groove); }
.tip { display: flex; gap: var(--space-sm); align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: var(--space-sm) var(--space-md); font-size: var(--text-sm); }
.tip p { flex: 1 1 260px; max-width: 72ch; }

/* ---------- controls: letterpress cards ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 40px; padding: 0 var(--space-md); border: 0; border-radius: var(--radius-stock);
  background-color: var(--color-cotton); background-image: var(--tex-cotton); color: var(--color-print); text-shadow: var(--press-text);
  box-shadow: var(--edge-stock), var(--cast-stock); font: 500 var(--text-sm)/1.15 var(--font-body); white-space: nowrap; cursor: pointer; text-align: center; text-decoration: none;
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out); }
.btn:hover { transform: translateY(-1px); box-shadow: var(--edge-stock), var(--cast-stock-lift); }
.btn:active { transform: translateY(1px); box-shadow: var(--edge-stock); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: var(--edge-stock); }
.btn[aria-busy="true"] { cursor: progress; }
.btn.ghost { box-shadow: var(--edge-stock); background-image: none; color: var(--color-ink); }
.btn.ghost:hover { box-shadow: var(--edge-stock), var(--cast-stock); }
.btn.sm { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-sm); }
.btn.big, .btn.ink { min-height: 44px; padding: 0 var(--space-lg); font-size: var(--text-md); background-color: var(--color-board); background-image: none; color: var(--color-board-type); text-shadow: 0 -0.75px 0 var(--color-ink); box-shadow: var(--cast-stock); }
.btn.big:hover, .btn.ink:hover { box-shadow: var(--cast-stock-lift); }
.btn.big:active, .btn.ink:active { box-shadow: none; }
.btn.danger { color: var(--color-bad); }
.btn[aria-pressed="true"]:not(.big) { box-shadow: var(--press-groove); background-image: none; background-color: var(--color-paper-2); transform: none; }
#cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-sticky); background: color-mix(in oklab, var(--color-paper) 94%, transparent); backdrop-filter: blur(6px); box-shadow: 0 calc(-1 * var(--rule-hair)) 0 var(--color-rule); display: flex; flex-wrap: wrap; gap: var(--space-xs); justify-content: flex-end; align-items: center; padding-top: var(--space-sm); padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom, 0px)); padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
#cta:empty { display: none; }
@media (max-width: 560px) { #cta .btn.big { flex: 1 1 auto; } }
.cta-hint { margin-right: auto; font-size: var(--text-sm); color: var(--color-muted); }

/* a choice of a few: a groove pressed into the stock, the chosen card riding in it */
.seg { display: flex; flex-wrap: wrap; gap: var(--space-2xs); padding: var(--space-2xs); border-radius: var(--radius-groove); background: var(--color-paper-2); box-shadow: var(--press-groove); }
.seg button { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; min-height: 40px; display: grid; gap: var(--space-3xs); align-content: center; padding: var(--space-xs) var(--space-sm); border: 0; border-radius: var(--radius-stock); background: transparent; color: var(--color-ink-2); text-align: left; cursor: pointer;
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out); }
.seg button b { font-weight: 600; color: var(--color-ink); }
.seg button small { font-size: var(--text-xs); color: var(--color-muted); }
.seg button:hover { background: color-mix(in oklab, var(--color-cotton) 55%, transparent); }
.seg button:active { transform: translateY(1px); }
.seg button:disabled { opacity: 0.55; cursor: not-allowed; }
.seg button.on, .seg button[aria-pressed="true"] { background-color: var(--color-cotton); background-image: var(--tex-cotton); color: var(--color-print); box-shadow: var(--edge-stock), var(--cast-stock); }
.seg.sm button { flex: 1 1 auto; min-height: 32px; padding: var(--space-2xs) var(--space-sm); font-size: var(--text-sm); text-align: center; white-space: nowrap; }
.setup .seg.sm button { flex: 1 1 auto; }
.seg.scen { display: grid; grid-template-columns: repeat(3, 1fr); }
@media (min-width: 560px) { .seg.scen { grid-template-columns: repeat(6, 1fr); } }
.segnote { margin-top: var(--space-xs); max-width: 70ch; color: var(--color-muted); }
.segnote b { color: var(--color-ink); font-weight: 600; }

/* ---------- title ---------- */
.hero { display: grid; gap: var(--space-lg); padding-top: var(--space-xs); }
.lockup { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-sm) var(--space-xl); align-items: end; max-width: 860px; }
.lk { display: grid; gap: var(--space-2xs); }
.lk .big { font: 600 var(--text-wordmark)/0.82 var(--font-display); letter-spacing: -0.06em; font-variant-numeric: lining-nums; }
.lk .sub { font-size: var(--text-sm); color: var(--color-muted); }
.hemi { width: 100%; height: auto; display: block; margin-top: var(--space-xs); }
.seat-d { fill: var(--dem); } .seat-r { fill: var(--rep); } .seat-x { fill: var(--color-rule-2); }
.majline { stroke: var(--color-ink); stroke-width: 0.012; }
.hero-lede { max-width: 60ch; font-size: var(--text-lg); line-height: 1.45; color: var(--color-ink-2); }
.setup { display: grid; gap: var(--space-lg); }
.lgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 228px), 1fr)); gap: var(--space-sm); }
.lcard { text-align: left; border: 0; padding: var(--space-md); display: grid; gap: var(--space-xs); align-content: start; cursor: pointer; position: relative;
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }
.lcard:hover { box-shadow: var(--edge-stock), var(--cast-stock-lift); }
.lcard:active { transform: translateY(1px); }
.lcard .lname { font: 600 var(--text-xl)/1.1 var(--font-display); letter-spacing: -0.02em; }
.lcard.dem .lname { color: var(--dem); } .lcard.rep .lname { color: var(--rep); }
.lcard .ltitle { font-size: var(--text-sm); color: var(--color-muted); }
.lcard .lgoal { font-size: var(--text-sm); }
.lcard .lodds { display: grid; gap: var(--space-3xs); padding-top: var(--space-xs); margin-top: var(--space-2xs); border-top: var(--rule-hair) solid var(--color-rule); font-size: var(--text-xs); color: var(--color-muted); }
.lcard .lodds b { font: 400 var(--text-xl)/1 var(--font-outlier); color: var(--color-ink); }
.lcard.sel { box-shadow: var(--edge-stock), var(--cast-stock), inset 0 0 0 2px var(--color-ink); }
.setrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: var(--space-lg); }
.namefld { display: grid; gap: var(--space-2xs); max-width: 360px; font-size: var(--text-sm); color: var(--color-muted); }
.namefld input { font-size: var(--text-md); color: var(--color-ink); background: var(--color-cotton); border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-input); padding: 0 var(--space-sm); min-height: 40px; }
.namefld input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.namefld input::placeholder { color: var(--color-muted); }
.namefld textarea { font: 400 var(--text-xs)/1.4 var(--font-outlier); color: var(--color-ink); background: var(--color-cotton); border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-input); padding: var(--space-xs) var(--space-sm); resize: vertical; word-break: break-all; }
.namefld textarea:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.namefld textarea::placeholder { color: var(--color-muted); }

/* saving: the browser-refuses notice, a one-time status line, backup and restore */
.notice { max-width: 72ch; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-card); background: var(--color-paper-2); color: var(--color-ink); font-size: var(--text-sm); box-shadow: var(--press-groove); }
.notice.warn { box-shadow: inset 0 0 0 1.5px var(--color-bad); background: var(--color-paper); }
.bk { display: grid; gap: var(--space-sm); padding-top: var(--space-xs); }
.bk .namefld { max-width: 560px; }
.bk-row { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.bk-confirm { display: grid; gap: var(--space-xs); padding: var(--space-md); border-radius: var(--radius-card); background: var(--color-paper-2); color: var(--color-ink); box-shadow: var(--press-groove); }
.small.good { color: var(--color-good); }
.small.bad { color: var(--color-bad); }
.resume { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
@media (max-width: 560px) { .resume { grid-template-columns: minmax(0, 1fr); } .lockup { gap: var(--space-xs) var(--space-md); } }
.hall { margin: 0; padding-left: var(--space-md); font-size: var(--text-sm); display: grid; gap: var(--space-2xs); }
.how { padding-top: var(--space-md); border-top: var(--rule-hair) solid var(--color-rule); }
.how summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
.how summary:hover { color: var(--color-ink-2); }
.how summary::after, .adstrat summary::after { content: "Show"; margin-left: auto; padding-left: var(--space-sm); font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); }
.how[open] summary::after, .adstrat[open] summary::after { content: "Hide"; }
.how summary::-webkit-details-marker, .adstrat summary::-webkit-details-marker { display: none; }
.how-body { display: grid; gap: var(--space-sm); padding-top: var(--space-sm); max-width: 70ch; font-size: var(--text-sm); }
.dlg { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--color-scrim); display: grid; place-items: center; padding: var(--space-md); padding-top: calc(var(--space-md) + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px)); }
.dlg-in { max-width: 640px; max-height: 100%; overflow: auto; padding: var(--space-lg); display: grid; gap: var(--space-sm); }
.dlg-in h2 { font-size: var(--text-2xl); }
.custom { display: grid; gap: var(--space-sm); margin-top: var(--space-xs); padding: var(--space-md); border-radius: var(--radius-card); background: var(--color-paper-2); color: var(--color-ink); box-shadow: var(--press-groove); }
.cust { display: grid; gap: var(--space-2xs); font-size: var(--text-sm); }
.cust span { display: flex; justify-content: space-between; gap: var(--space-xs); }
.cust b { font-family: var(--font-outlier); font-weight: 400; }
.cust input[type=range] { width: 100%; accent-color: var(--color-ink); min-height: 32px; }
.setup > div > .small { margin-top: var(--space-xs); max-width: 70ch; }

/* ---------- the chamber bar ---------- */
.cbar { display: grid; gap: var(--space-xs); }
.cbar-track { position: relative; height: 20px; display: flex; border-radius: var(--radius-chip); overflow: hidden; background: var(--color-paper-3); box-shadow: var(--press-groove); }
.cbar-track i { display: block; height: 100%; }
.cbar-track i.dem { background: var(--dem); } .cbar-track i.rep { background: var(--rep); } .cbar-track i.oth { background: var(--color-muted); } .cbar-track i.unc { background: transparent; }
.cline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--color-ink); box-shadow: 0 0 0 1px var(--color-cotton); }
.cbar-lbl { display: flex; justify-content: space-between; gap: var(--space-xs); font-size: var(--text-sm); flex-wrap: wrap; }
.cbar-lbl .dem-t, .cbar-lbl .rep-t { font-family: var(--font-outlier); }
.cbar-lbl .need { color: var(--color-muted); font-size: var(--text-xs); }

/* ---------- figures that compare ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--space-md); }
.tile { display: grid; gap: var(--space-3xs); align-content: start; padding-left: var(--space-sm); border-left: var(--rule-hair) solid var(--color-rule-2); }
.tile small { font-size: var(--text-xs); color: var(--color-muted); }
.tile b { font: 400 var(--text-2xl)/1.1 var(--font-outlier); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.tile span { font-size: var(--text-xs); color: var(--color-muted); }
.map-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); }
@media (max-width: 560px) { .map-tiles .tile b { font-size: var(--text-xl); } }
.fc { grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: var(--space-xl); }
.fc-big { display: grid; gap: var(--space-2xs); }
.fc-big small, .fc-side small { font-size: var(--text-sm); color: var(--color-muted); }
.fc-big b { font: 400 var(--text-4xl)/0.95 var(--font-outlier); letter-spacing: -0.04em; color: var(--color-ink); }
.fc-side { display: grid; gap: var(--space-2xs); }
.fc-side b { font: 400 var(--text-2xl)/1 var(--font-outlier); }
.fc-side span { font-size: var(--text-sm); color: var(--color-muted); }

/* ---------- meters and factions ---------- */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--space-md); }
.meter { display: grid; gap: var(--space-2xs); }
.mlbl { display: flex; justify-content: space-between; font-weight: 600; font-size: var(--text-sm); }
.mnum { font-family: var(--font-outlier); font-weight: 400; }
.dv { margin-left: var(--space-2xs); font-size: var(--text-xs); }
.mbar { height: 6px; border-radius: var(--radius-chip); background: var(--color-paper-3); box-shadow: var(--press-groove); overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--color-ink); border-radius: var(--radius-chip); }
.mhelp { font-size: var(--text-xs); color: var(--color-muted); }
.facs { list-style: none; margin: var(--space-2xs) 0 0; padding: 0; display: grid; gap: var(--space-sm); }
.facs li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(64px, 1fr) auto; gap: var(--space-sm); align-items: center; }
.fh { display: grid; line-height: 1.3; min-width: 0; }
.fh b { font-size: var(--text-sm); }
.ml { font-size: var(--text-xs); white-space: nowrap; }
.whip { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
.wf { display: inline-grid; gap: var(--space-3xs); font-size: var(--text-xs); padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-chip); box-shadow: inset 0 0 0 1px var(--color-rule-2); color: var(--color-muted); }
.wf b { font-weight: 600; color: var(--color-ink); }
.wf.y { box-shadow: inset 0 0 0 1.5px var(--color-ink); color: var(--color-ink); }
.wf.ly { box-shadow: inset 0 0 0 1px var(--color-ink-2); color: var(--color-ink-2); }
.wf.ln { box-shadow: inset 0 0 0 1px var(--color-bad); color: var(--color-bad); }
.wf.n { box-shadow: inset 0 0 0 1.5px var(--color-bad); color: var(--color-bad); }

/* ---------- tables, chips, tags ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl th { text-align: left; font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); padding: var(--space-xs) var(--space-2xs); border-bottom: var(--rule-hair) solid var(--color-rule-2); white-space: nowrap; }
.tbl td { padding: var(--space-xs) var(--space-2xs); border-bottom: var(--rule-hair) solid var(--color-rule); vertical-align: middle; }
.tbl td .sub { display: block; font-size: var(--text-xs); color: var(--color-muted); }
.tbl .r { text-align: right; }
.chip { display: inline-block; font-size: var(--text-xs); font-weight: 500; line-height: 1; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-chip); white-space: nowrap; }
.chip.toss { background: var(--color-cotton); color: var(--color-ink); box-shadow: inset 0 0 0 1px var(--color-ink); }
.chip.lean.D { background: var(--dem-bg); color: var(--dem); } .chip.lean.R { background: var(--rep-bg); color: var(--rep); }
.chip.likely.D { background: var(--dem-2); color: var(--likely-ink); } .chip.likely.R { background: var(--rep-2); color: var(--likely-ink); }
.chip.safe.D { background: var(--dem); color: var(--dem-ink); } .chip.safe.R { background: var(--rep); color: var(--rep-ink); }
.pill { display: inline-block; font-size: var(--text-xs); font-weight: 500; line-height: 1.2; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-chip); box-shadow: inset 0 0 0 1px var(--color-ink-2); color: var(--color-ink); white-space: nowrap; }
.pill.warn { box-shadow: inset 0 0 0 1px var(--color-bad); color: var(--color-bad); }
.tag { font-size: var(--text-xs); color: var(--color-muted); }
.q { font: 400 var(--text-xs)/1 var(--font-outlier); }
.tagp { font-size: var(--text-xs); font-weight: 500; padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-chip); box-shadow: inset 0 0 0 1px var(--color-ink-2); color: var(--color-ink); white-space: nowrap; }
.their { font-size: var(--text-xs); font-weight: 500; padding: 0 var(--space-2xs); border-radius: var(--radius-chip); box-shadow: inset 0 0 0 1px var(--color-muted); color: var(--color-muted); vertical-align: 1px; }
/* the settled state, pressed into the stock in coral */
.pill.ok, .stamp { display: inline-block; color: var(--color-paid); background: transparent; box-shadow: inset 0 0 0 1.5px var(--color-paid); font-weight: 600; letter-spacing: 0; text-shadow: -0.5px -0.5px 0 oklch(var(--shade) / 0.25), 0.5px 0.75px 0 oklch(var(--lit) / 0.7); transform: rotate(-3deg); border-radius: var(--radius-chip); }
.stamp { font-size: var(--text-lg); padding: var(--space-3xs) var(--space-sm); }

/* ---------- agenda ---------- */
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: var(--space-sm); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 228px), 1fr)); gap: var(--space-sm); }
.icard, .tcard { text-align: left; border: 0; padding: var(--space-sm) var(--space-md); display: grid; gap: var(--space-2xs); align-content: start; cursor: pointer;
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }
.icard:hover, .tcard:hover { box-shadow: var(--edge-stock), var(--cast-stock-lift); }
.icard:active, .tcard:active { transform: translateY(1px); }
.icard .in, .tcard .in { font-weight: 600; }
.icard .id, .tcard .id { font-size: var(--text-sm); color: var(--color-muted); }
.icard .iv, .tcard .iv { font-size: var(--text-xs); color: var(--color-muted); }
.icard .iv b { font: 400 var(--text-sm)/1.2 var(--font-outlier); }
.icard.on, .tcard.on { box-shadow: var(--edge-stock), var(--cast-stock), inset 0 0 0 2px var(--color-ink); }
.icard:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.sticky-sum { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: var(--z-raised); padding: var(--space-sm) var(--space-md); border: 0; border-radius: var(--radius-card); background-color: var(--color-cotton); box-shadow: var(--edge-stock), var(--cast-stock-lift); }
.mv { font-size: var(--text-sm); }
.mv.up { color: var(--color-good); } .mv.dn { color: var(--color-bad); } .mv.flat { color: var(--color-muted); }

/* ---------- option cards: index cards ---------- */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: var(--space-sm); }
.opt { padding: var(--space-md); display: grid; gap: var(--space-xs); align-content: start; }
.opt.sel { box-shadow: var(--edge-stock), var(--cast-stock), inset 0 0 0 2px var(--color-ink); }
.opt.dis { opacity: 0.6; box-shadow: var(--edge-stock); }
.opt-top { display: flex; justify-content: space-between; gap: var(--space-sm); align-items: flex-start; }
.opt-top h3 { font-size: var(--text-md); letter-spacing: -0.01em; }
.opt-d { font-size: var(--text-sm); color: var(--color-muted); }
.fx { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2xs); font-size: var(--text-sm); }
.fx li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: var(--space-xs); }
.fx li b { font-size: var(--text-xs); font-weight: 500; line-height: 1.7; color: var(--color-muted); }
.fx li.ok b { color: var(--color-good); } .fx li.no b { color: var(--color-bad); }
.note { font-size: var(--text-xs); color: var(--color-ink-2); }
.opt-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); flex-wrap: wrap; border-top: var(--rule-hair) solid var(--color-rule); padding-top: var(--space-sm); margin-top: auto; }
/* a statement: what happened */
.result { padding: var(--space-md) var(--space-lg); display: grid; gap: var(--space-xs); scroll-margin-top: 80px; }
.result h2 { font-size: var(--text-2xl); }
.result.good { box-shadow: var(--edge-stock), var(--cast-stock), inset 4px 0 0 var(--color-ink); }
.result.bad { box-shadow: var(--edge-stock), var(--cast-stock), inset 4px 0 0 var(--color-bad); }
.verdict { justify-self: start; font-size: var(--text-xs); font-weight: 500; padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-chip); box-shadow: inset 0 0 0 1px var(--color-ink-2); }
.result.bad .verdict { box-shadow: inset 0 0 0 1px var(--color-bad); color: var(--color-bad); }
/* a memo: an event that lands on your desk */
.event { padding: var(--space-lg); display: grid; gap: var(--space-xs); }
.event h2 { font-size: var(--text-2xl); }
.event p { max-width: 68ch; }
.event .muted { color: var(--color-muted); }
.evc { font-size: var(--text-xs); color: var(--color-muted); }

/* ---------- recruit and primary sheets ---------- */
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: var(--space-sm); }
.rcard { padding: var(--space-md); display: grid; gap: var(--space-xs); align-content: start; }
.rc-top { display: flex; justify-content: space-between; gap: var(--space-sm); align-items: flex-start; }
.rc-top h3 { font-size: var(--text-lg); }
.plist { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--space-xs); }
.pros { display: grid; gap: var(--space-xs); padding-top: var(--space-xs); border-top: var(--rule-hair) solid var(--color-rule); font-size: var(--text-sm); }
.pros.no { opacity: 0.6; }
.pros.no b { text-decoration: line-through; text-decoration-thickness: 1px; }
.pros.got { padding: var(--space-xs); border-top: 0; border-radius: var(--radius-input); box-shadow: inset 0 0 0 1px var(--color-rule-2); }
.pros .pill { margin-right: var(--space-2xs); }

/* ---------- the campaign map ---------- */
.maptools { display: flex; gap: var(--space-xs); flex-wrap: wrap; align-items: center; }
.mlist { display: grid; gap: var(--space-sm); }
.mrow { padding: var(--space-sm) var(--space-md); display: grid; gap: var(--space-xs); scroll-margin-top: 90px; }
.mrow.focus { box-shadow: var(--edge-stock), var(--cast-stock), inset 0 0 0 2px var(--color-ink); }
.mr-x { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.rsv { font-style: normal; font-family: var(--font-outlier); }
.mr-h { display: flex; justify-content: space-between; gap: var(--space-sm); align-items: flex-start; }
.mr-h h3 { font-size: var(--text-lg); }
.mr-odds { display: flex; align-items: center; gap: var(--space-xs); }
.mr-odds b { font: 400 var(--text-xl)/1 var(--font-outlier); min-width: 3ch; text-align: right; }
.mr-c { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); align-items: baseline; font-size: var(--text-sm); }
.cand.dem b { color: var(--dem); } .cand.rep b { color: var(--rep); }
.vs { color: var(--color-muted); font-size: var(--text-xs); }
.mr-p, .mr-m { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-md); color: var(--color-muted); }
.mr-p b, .mr-m b { color: var(--color-ink); font-family: var(--font-outlier); font-weight: 400; }
.mr-m em { font-style: normal; font-family: var(--font-outlier); }
.mr-a { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; border-top: var(--rule-hair) solid var(--color-rule); padding-top: var(--space-xs); }
.stepper { display: inline-flex; align-items: center; gap: var(--space-2xs); padding: var(--space-3xs); border-radius: var(--radius-groove); background: var(--color-paper-2); box-shadow: var(--press-groove); }
.stepper .btn { min-width: 36px; }
.slbl { display: grid; justify-items: center; line-height: 1.15; padding: 0 var(--space-2xs); font: 400 var(--text-xs)/1.2 var(--font-outlier); white-space: nowrap; }
.slbl small { font: 500 var(--text-xs)/1.2 var(--font-body); color: var(--color-muted); }
@media (max-width: 480px) { .mr-a .stepper { flex: 1 1 0; min-width: 0; justify-content: space-between; } .mr-x { flex: 1 1 100%; } .mr-x .btn { flex: 1 1 auto; } }
.polls { display: grid; gap: var(--space-2xs); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-input); background: var(--color-paper-2); box-shadow: var(--press-groove); }
.polls .ph { display: flex; justify-content: space-between; gap: var(--space-xs); flex-wrap: wrap; font-size: var(--text-xs); font-weight: 600; color: var(--color-ink); }
.polls .ph i { font-weight: 400; font-style: normal; color: var(--color-muted); }
.polls ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3xs); }
.polls li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: var(--space-xs); align-items: baseline; font-size: var(--text-sm); }
.polls li b { font: 400 var(--text-sm)/1.3 var(--font-outlier); }
.polls li i { font: 400 var(--text-xs)/1.3 var(--font-outlier); color: var(--color-muted); font-style: normal; }
.polls li.int span { color: var(--color-ink); font-weight: 500; }
.polls li.avg { border-top: var(--rule-hair) solid var(--color-rule-2); padding-top: var(--space-2xs); margin-top: var(--space-3xs); font-weight: 600; }
.polls li.new { background: var(--color-cotton); border-radius: var(--radius-chip); box-shadow: inset 0 0 0 1px var(--color-ink-2); padding: 0 var(--space-2xs); }
.polls li em { font-size: var(--text-xs); font-weight: 600; font-style: normal; color: var(--color-ink); }
.pollnew { font-size: var(--text-sm); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-input); box-shadow: inset 0 0 0 1px var(--color-ink-2); }
.cnt { font: 400 var(--text-xs)/1 var(--font-outlier); color: var(--color-muted); margin-left: var(--space-2xs); }
.adstrat { border-top: var(--rule-hair) solid var(--color-rule); padding-top: var(--space-2xs); }
.adstrat summary { cursor: pointer; font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); min-height: 32px; display: flex; align-items: center; }
.as-row { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-sm); align-items: center; margin-top: var(--space-xs); }
.as-l { font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); min-width: 64px; }
.as-row .seg button { display: grid; gap: var(--space-3xs); text-align: left; }
.as-row .seg button small { font-size: var(--text-xs); color: var(--color-muted); }
.cutnote { font-size: var(--text-sm); color: var(--color-bad); }

/* the tile map: one square per state */
.mapwrap { display: grid; gap: var(--space-md); align-items: start; }
@media (min-width: 900px) { .mapwrap { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } .detcol { position: sticky; top: 72px; max-height: calc(100vh - 160px); overflow: auto; padding-right: var(--space-3xs); } }
.mapcol { display: grid; gap: var(--space-sm); min-width: 0; }
.detcol { display: grid; gap: var(--space-xs); min-width: 0; align-content: start; }
.det-h .h3 { margin: 0; font-size: var(--text-lg); }
.tmap { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); grid-template-rows: repeat(8, auto); gap: var(--space-3xs); container-type: inline-size; padding: var(--space-xs); border-radius: var(--radius-card); background: var(--color-paper-2); box-shadow: var(--press-groove); }
.tl { aspect-ratio: 1; min-width: 0; border-radius: var(--radius-chip); border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3xs); position: relative; background: var(--color-paper-3); color: var(--color-muted); font: 500 clamp(9px, 2.7cqw, 13px)/1 var(--font-body); }
.tl b { font-weight: 600; }
.tl small { font: 400 clamp(8px, 2.2cqw, 11px)/1 var(--font-outlier); }
.tl.off { background: transparent; color: var(--color-rule-2); font-weight: 400; }
button.tl { cursor: pointer; transition: transform var(--dur-micro) var(--ease-out); }
button.tl:hover { outline: 2px solid var(--color-rule-2); outline-offset: 1px; }
button.tl:active { transform: translateY(1px); }
.tl.sel { outline: 2px solid var(--color-ink); outline-offset: 1px; z-index: var(--z-base); }
.tl .spend { position: absolute; top: var(--space-3xs); right: var(--space-3xs); width: 6px; height: 6px; border-radius: 50%; background: var(--color-ink); box-shadow: 0 0 0 1px var(--color-cotton); }
.tl.hs { background: var(--color-cotton); box-shadow: var(--edge-stock); color: var(--color-ink); justify-content: flex-start; padding-top: 10%; }
.dg { display: flex; flex-wrap: wrap; gap: 1px; justify-content: center; width: 86%; margin-top: var(--space-3xs); }
.dg i { width: 28%; aspect-ratio: 1; border-radius: 1px; background: var(--color-paper-3); }
.rt-safe.D, .legend .rt-safe.D { background: var(--dem); color: var(--dem-ink); }
.rt-likely.D, .legend .rt-likely.D { background: var(--dem-2); color: var(--likely-ink); }
.rt-lean.D, .legend .rt-lean.D { background: var(--dem-bg); color: var(--dem); }
.rt-toss, .legend .rt-toss { background: var(--color-cotton); color: var(--color-ink); box-shadow: inset 0 0 0 1px var(--color-ink); }
.rt-lean.R, .legend .rt-lean.R { background: var(--rep-bg); color: var(--rep); }
.rt-likely.R, .legend .rt-likely.R { background: var(--rep-2); color: var(--likely-ink); }
.rt-safe.R, .legend .rt-safe.R { background: var(--rep); color: var(--rep-ink); }
.call.D, .fin.D { background: var(--dem); color: var(--dem-ink); }
.call.R, .fin.R { background: var(--rep); color: var(--rep-ink); }
.lead.D { background: var(--dem-bg); color: var(--dem); }
.lead.R { background: var(--rep-bg); color: var(--rep); }
.closed { background: var(--color-cotton); color: var(--color-ink); box-shadow: inset 0 0 0 1px var(--color-ink-2); }
.wait { background: var(--color-paper-3); }
.tl.flip, .dg i.flip { box-shadow: inset 0 0 0 2px var(--color-ink); }
.dg i.flip { outline: 1px solid var(--color-ink); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.legend span { display: inline-flex; align-items: center; gap: var(--space-2xs); }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.legend i.dot { border-radius: 50%; width: 8px; height: 8px; background: var(--color-ink); }
.legend i.flipk { box-shadow: inset 0 0 0 2px var(--color-ink); background: var(--color-paper-3); }
.rchips { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.rchip { border: 0; border-radius: var(--radius-stock); padding: 0 var(--space-sm); min-height: 32px; font-size: var(--text-xs); cursor: pointer; background-color: var(--color-cotton); color: var(--color-print); box-shadow: var(--edge-stock);
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }
.rchip:hover { box-shadow: var(--edge-stock), var(--cast-stock); }
.rchip:active { transform: translateY(1px); }
.rchip b { font-family: var(--font-outlier); font-weight: 400; margin-left: var(--space-2xs); }
.rchip.on { box-shadow: var(--edge-stock), inset 0 0 0 2px var(--color-ink); }

/* the issue landscape */
.ilist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2xs); }
.ilist li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(60px, 1fr) 16px 88px; gap: var(--space-xs); align-items: center; font-size: var(--text-sm); }
.ilist li.mine .iname { font-weight: 600; }
.sbar { height: 6px; border-radius: var(--radius-chip); background: var(--color-paper-3); overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--color-muted); }
.ilist .mine .sbar i { background: var(--color-ink); }
.edge { font-size: var(--text-xs); text-align: right; }
.yours { font-size: var(--text-xs); color: var(--color-muted); font-weight: 400; }

/* ---------- election night ---------- */
.nboard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: var(--space-md); align-items: start; }
@media (max-width: 760px) { .nboard { grid-template-columns: minmax(0, 1fr); } }
.ncol { display: grid; gap: var(--space-sm); min-width: 0; }
.night-h h1 { font-family: var(--font-outlier); font-weight: 400; font-size: var(--text-3xl); letter-spacing: -0.04em; }
.needle-wrap { padding: var(--space-md); display: grid; gap: var(--space-xs); justify-items: center; }
.needle { width: 100%; max-width: 360px; height: auto; }
.nb { fill: none; stroke-width: 0.16; }
.nb.d3 { stroke: var(--dem); } .nb.d2 { stroke: var(--dem-2); } .nb.d1 { stroke: var(--dem-bg); }
.nb.r3 { stroke: var(--rep); } .nb.r2 { stroke: var(--rep-2); } .nb.r1 { stroke: var(--rep-bg); }
.nd-line { stroke: var(--color-ink); stroke-width: 0.035; stroke-linecap: round; }
.nd-hub { fill: var(--color-ink); }
.nd-t { font: 600 0.16px var(--font-body); }
.dem-f { fill: var(--dem); } .rep-f { fill: var(--rep); }
.nd-read { display: grid; justify-items: center; text-align: center; gap: var(--space-2xs); }
.nd-read small { font-size: var(--text-sm); color: var(--color-muted); }
.nd-read b { font: 400 var(--text-4xl)/1 var(--font-outlier); letter-spacing: -0.04em; }
.nd-read span { font-size: var(--text-xs); }
.night-bar { padding-top: var(--space-xs); }

  const btns = keys.map(k => `<button class="${TITLE.scen === k ? "on" : ""}" data-act="scen" data-k="${k}" aria-pressed="${TITLE.scen === k}">${k === "y2026" ? "2026" : k === "custom" ? "Custom" : SCEN[k].n}</button>`).join("");
  const sc = SCEN[TITLE.scen];
  let note = "";
  if (sc) note = `<p class="small segnote"><b>${esc(sc.title)}.</b> ${esc(sc.blurb)} Senate: the real ${sc.n} map, with fictional candidates. House: today's battleground districts, re-weighted to the ${sc.n} House (${sc.house.start.D} D, ${sc.house.start.R} R). One cycle.</p>`;
  else if (TITLE.scen === "custom") { const c = TITLE.custom; const sl = (k, min, max, step) => `<label class="cust"><span>${{ appr: "President's approval", env: "Generic ballot", u: "Unemployment", inf: "Inflation" }[k]} <b id="cv-${k}">${custLbl(k, c[k])}</b></span><input type="range" id="cust-${k}" data-cust="${k}" min="${min}" max="${max}" step="${step}" value="${c[k]}"></label>`;
    note = `<div class="custom"><div class="row"><span class="small">President's party</span><div class="seg sm" role="group"><button class="${c.party === "R" ? "on" : ""}" data-act="cparty" data-k="R" aria-pressed="${c.party === "R"}">Republican</button><button class="${c.party === "D" ? "on" : ""}" data-act="cparty" data-k="D" aria-pressed="${c.party === "D"}">Democrat</button></div><button class="btn ghost sm" data-act="cwar" aria-pressed="${c.war}">${c.war ? "War overseas: yes" : "War overseas: no"}</button></div>${sl("appr", 25, 65, 1)}${sl("env", -12, 12, 0.5)}${sl("u", 3, 10, 0.1)}${sl("inf", 1, 9, 0.1)}<p class="muted small">Today's map and Congress, with your conditions. Generic ballot is the national margin (positive = Democrats). Continues into later cycles.</p></div>`; }
  else note = `<p class="small segnote"><b>Today.</b> The real map: seat counts, battlegrounds and the national mood as of mid-October 2026.</p>`;
  return `<div><h3 class="h3">Scenario</h3><div class="seg sm scen" role="group">${btns}</div>${note}</div>`;
}

    ${SCEN[TITLE.scen] ? "" : `<div><h3 class="h3">Length</h3>${seg("mode", TITLE.mode, [["full", "Full cycle", "About 18 steps, play as long as you last"], ["quick", "Final stretch", "4 steps: the last two weeks"], ["career", "Career", "Six cycles: start as campaign chair, rise to leader"]])}${TITLE.mode === "career" ? `<p class="small segnote">You start as your party's campaign chair under ${esc(LEADERS.find(l => l.k === TITLE.lk).name)}: recruit, raise and spend while the leader runs the floor. Win, and the caucus may make you leader. Your legacy score is tallied in 2036.</p>` : ""}</div>`}</div>
    <label class="namefld"><span>Your name (optional)</span><input id="lname" type="text" maxlength="28" placeholder="${TITLE.mode === "career" && !SCEN[TITLE.scen] ? "A rising member, named for you" : esc(LEADERS.find(l => l.k === TITLE.lk).name)}" value="${esc(TITLE.name)}" autocomplete="off"></label>

function howHtml() {
  return `<details class="how" id="how"${keepOpen("how", false)}><summary>How it works</summary><div class="how-body">
  <p><b>The goal.</b> Win a majority in your chamber: 218 House seats, or 51 Senate seats (50 if your party holds the vice presidency). After each election you govern the next Congress and play the next cycle with whatever map you've left yourself.</p>
  <p><b>The model.</b> Every race has an expected margin built from today's conditions. Your choices add or subtract <i>points of margin</i>. National points apply everywhere; others hit one kind of race (suburban, rural, working-class, Latino-heavy) or one state. Hidden luck is drawn at the start: a national swing (about ±2.6 points) and a race-level swing (±3.4 in the Senate, ±3.8 in the House). Polls measure the true state of a race with error, and the final result uses the same hidden luck, so polls and results agree on average but can miss together.</p>
  <p><b>Polls.</b> Public polls are free but noisy (about ±4.5 points on each candidate's share) and can all miss in the same direction. Internal polls cost money and are tighter (about ±2.7), but your pollster has a small house lean of its own. Poll a race again and the new result is listed and averaged with the old ones. The forecast blends fundamentals with every poll and allows for a late national swing after the last polls, so a race one or two points back in your internals is usually a 30 to 40 percent shot, not a lost cause.</p>
  <p><b>The President.</b> Each point of approval moves the national environment by a quarter point. That helps the President's party when approval rises and hurts it when approval falls.</p>
  <p><b>Issues.</b> Which party an issue helps depends on conditions. High inflation makes cost of living a weapon for the party out of the White House; a weak job market does the same for jobs; an unpopular war hurts the President's party. When the White House changes hands, the blame flips. Salience drifts all cycle and jumps with events, so your agenda can gain or lose value after you set it.</p>
  <p><b>Your rival.</b> The other party's leader has a style (Brawler, Dealmaker, Money Machine or Ground General), picks an agenda you can contest, and makes two moves in September that you must answer. Styles change their ads, fundraising, field and how bipartisan deals go.</p>
  <p><b>Factions and your job.</b> Your caucus has three factions with their own moods; Unity is their average. Party-line bills need your moderates, deals cost you your wing, and whip counts show who's leaning where. After a loss your caucus may hold a leadership vote, and if Unity collapses mid-cycle a revolt can come early. Lose either and your run ends.</p>
  <p><b>Ad strategy.</b> Each race's ads can be positive, contrast (about 15% stronger, 10% backfire risk) or attack (about 35% stronger, 22% backfire). Pick a message from your agenda: a good fit makes ads up to 45% stronger, a bad one 30% weaker. Message tests measure the fit for that race. Cut bait to pull 60% of your money out of a lost cause.</p>
  <p><b>Overtime.</b> Georgia requires a majority, so a close race can go to a December runoff where turnout drops and your base matters more. Races under half a point go to a recount. Maine and Alaska count ranked-choice ballots, so close races there take extra days.</p>
  <p><b>Scenarios.</b> 2006, 2010, 2018 and 2022 use that year's Senate map and national mood with fictional candidates. The House uses today's battleground districts, re-weighted to that year's chamber. Margins are approximate. Custom lets you set the conditions on today's map.</p>
  <p><b>On the floor.</b> Each spring two floor fights follow your signature bill: in the Senate, filibusters, the nuclear option, vetoes and confirmation fights (sometimes a Supreme Court seat); in the House, discharge petitions, rebellions and impeachment pushes. End the filibuster and every future majority, including theirs, keeps that power.</p>
  <p><b>Presidential years.</b> In 2028, 2032 and 2036 your party's nominee picks a running mate, the conventions bounce the race, and a debate can swing it. What your nominee gains or loses beyond the national mood carries down the ballot: about 60% if you run with the ticket, 25% if you run your own races.</p>
  <p><b>Ballot measures and the trail.</b> Initiatives in battleground states bring out one side's voters; you can fund them or fight them. In October your candidates have moments: debates, gaffes, scandals, endorsements. Better recruits debate better.</p>
  <p><b>Turnout.</b> Ads and visits persuade. In the final push you can also buy a turnout operation: bank early votes (steadier, strong where people vote by mail), an Election Day surge (rural and working-class races) or a gamble on new voters. On election night, early votes are counted first, and in very close races you can pay to cure flagged mail ballots before the race is called.</p>
  <p><b>Between elections.</b> Members retire, and seats open up. A special election or a governor's appointment can flip a seat, and occasionally the majority, before the next cycle. Your rival can retire too. Strong recruits who lose close races join your bench and can run again.</p>
  <p><b>Career.</b> Six cycles from 2026 to 2036. You start as campaign chair, running the campaign while your leader runs the floor, then face a leadership election. Your legacy score adds up majorities, flips, beating the forecast, landmark laws, confirmations and specials.</p>
  <p><b>Later cycles.</b> If the fundamentals would leave you below about 20 percent or above about 85 percent, the national mood swings until the cycle starts within reach. Real majorities rarely stay lopsided for long.</p>
  <p><b>Base, Swing and Unity.</b> Base raises turnout (strongest in rural and working-class races). Swing persuades independents (strongest in the suburbs). Unity raises your odds on votes and holds down insurgents in primaries.</p>
  <p><b>Money.</b> Ads and field programs have diminishing returns in each race: the second buy is worth half the first, the third a third. Field is cheaper, works through turnout, and narrows the range of outcomes. The other side spends too, and shows its plan.</p>
  <p><b>Starting point.</b> Senate 53 R and 47 D; House 218 R and 214 D with one independent and two vacancies, on the redrawn 2026 maps. President's approval about 37%, generic ballot about D+8, unemployment 4.2%, inflation 3.4%. Starting odds are tuned to mid-October 2026 forecasts and prediction markets (Democrats about 60% for the Senate and about 85 to 90% for the House). Race margins are approximate and built from Cook Political Report, Sabato's Crystal Ball and Inside Elections ratings and public polling averages.</p>
  <p class="muted">A fictional simulation. Events are invented and are not claims about real people.</p>
  </div></details>`;
}

  ${rivalCard(false)}

  <section class="tiles">

  <section class="panel fc"><div class="fc-big"><small>Your majority odds</small><b>${pct(f.p)}</b></div><div class="fc-side"><small>Projected ${PARTY[G.p]}</small><b>${Math.round(f.mean)}</b><span>seats, likely ${f.lo} to ${f.hi}</span></div></section>

/* ---------- agenda ---------- */
function rAgenda() {
  const A = G.st.agenda, B = bg();
  const avgIssue = I => M.issueK * B.reduce((s, r) => s + issueVal(I, r.type) - issueAvg(r.type), 0) / Math.max(1, B.length);
  const trend = k => { const d = salOf(k) - (G.salStart[k] || salOf(k)); return d > 0.04 ? " ▲" : d < -0.04 ? " ▼" : ""; };
  const salLbl = v => v >= 1.1 ? "High" : v >= 0.9 ? "Medium" : "Low";
  const rag = (G.rival && G.rival.ag) || [];
  const cards = ISSUES.map(I => { const on = A.sel.includes(I.k), v = avgIssue(I); const full = !on && A.sel.length >= 3; const theirs = rag.includes(I.k);
    return `<button class="icard ${on ? "on" : ""}" data-act="issue" data-k="${I.k}" aria-pressed="${on}" ${full ? "disabled" : ""}><span class="in">${esc(I.n)}${theirs ? ` <span class="their">their issue</span>` : ""}</span><span class="id">${esc(I.d)}${theirs ? " Contest it: their edge here is halved, yours shrinks by a quarter." : ""}</span><span class="iv"><b class="${v >= 0 ? "up" : "dn"}">${signed(v, 2)}</b> vs. an average issue</span><span class="iv">${salLbl(salOf(I.k))} salience${trend(I.k)}, ${issueEdge(I, G.p) >= issueEdge(I, opp()) ? "your turf" : "their turf"}</span></button>`; }).join("");
  const tones = TONES.map(T => { const on = A.tone === T.k; return `<button class="tcard ${on ? "on" : ""}" data-act="tone" data-k="${T.k}" aria-pressed="${on}"><span class="in">${esc(T.n)}</span><span class="id">${esc(T.d)}</span><span class="iv">${esc(fxStr(T.fx))}</span></button>`; }).join("");
  const base = baseOdds();
  const after = previewWith(() => { G.issues = A.sel.slice(); if (A.tone) applyFx(TONES.find(t => t.k === A.tone).fx); });
  return `${stageHead("Set the national agenda", "Pick three issues to run on and the tone of your campaign. Each number is the shift in your battleground races compared with running on an average issue. Values follow conditions: who holds the White House, prices, jobs, the war. Salience keeps moving all cycle.")}
  ${rivalCard(true)}
  <section><h2 class="h3">Issues <span class="muted">(${A.sel.length} of 3)</span></h2><div class="igrid">${cards}</div></section>
  <section><h2 class="h3">Tone</h2><div class="tgrid">${tones}</div></section>
  <section class="panel sticky-sum">${oddsMove(base, after)}</section>`;
}

/* ---------- governing and deadline (choice stages) ---------- */
function rChoice(kind) {
  const S = G.st[kind]; const opts = (kind === "govern" ? GOVERN : DEADLINE)[S.role];
  const head = kind === "govern"
    ? stageHead(G.cyc === 1 ? "Year one: the legislative fight" : "The new Congress gets to work", roleLede(S.role))
    : stageHead("The funding deadline", "Government funding runs out at midnight on September 30. How you play it will shape the fall.");
  if (S.pick) {
    const o = opts.find(x => x.k === S.pick);
    return head + resultBox(S.ok, S.ok ? "It worked" : "It backfired", (S.ok ? o.s.rec : o.f.rec) || o.n, [esc(S.tally), esc(fxStr(S.ok ? o.s : o.f))]) + `<section class="panel"><h2 class="ph">Your caucus</h2>${meters()}</section>`;
  }
  const base = baseOdds();
  return head + `<div class="opts">${opts.map(o => optCard(o, "choose", base)).join("")}</div><section class="panel"><h2 class="ph">Your caucus</h2>${meters()}</section>`;
}
function roleLede(rl) {
  const pn = esc(G.pres.name);
  return { tri: `Your party holds the White House and your chamber. President ${pn}'s approval is ${num1(G.pres.appr)}%, so every win for him is a mixed blessing.`,
    opp: `You're in the minority and President ${pn} is from the other party. You can fight, deal, or force votes.`,
    majopp: `You run your chamber and the President is from the other party. Use the gavel.`,
    minpres: `Your party holds the White House but not your chamber. Help the President, or carve your own path.` }[rl];
}

/* ---------- recruitment ---------- */
function rRecruit() {
  const S = G.st.rec, f = getFC();
  const prom = G.ch === "S" ? 4 : 1;
  const cards = S.targets.map(T => {
    const r = G.races.find(x => x.id === T.id), j = G.races.indexOf(r);
    const pros = T.pros.map((P, i) => {
      const asked = T.asked.includes(i), got = T.locked === i;
      const btns = T.locked != null || S.done ? "" : asked ? `<span class="muted small">Said no</span>` :
        `<div class="row"><button class="btn sm" data-act="call" data-k="${T.id}" data-i="${i}" ${G.calls <= 0 ? "disabled" : ""}>Call (${pct(P.yes)})</button><button class="btn ghost sm" data-act="call" data-k="${T.id}" data-i="${i}" data-pr="1" ${G.calls <= 0 || G.cash < prom ? "disabled" : ""}>Promise ${money(prom)} (${pct(Math.min(0.95, P.yes + 0.2))})</button></div>`;
      return `<li class="pros ${got ? "got" : asked ? "no" : ""}"><div>${P.bench ? `<span class="pill">Your bench</span> ` : ""}<b>${esc(P.n)}</b> <span class="tag">${esc(P.tag)}</span> <span class="q up">+${P.q.toFixed(1)}</span>${P.self ? ` <span class="tag">brings ${money(prom)} of ads</span>` : ""}</div>${got ? `<span class="pill ok">Signed</span>` : btns}</li>`;
    }).join("");
    return `<article class="rcard"><div class="rc-top"><div><h3>${esc(raceName(r))}</h3><span class="muted small">${esc(seatDesc(r))}</span></div>${chip(f.rp[j], r)}</div>
      <p class="small">Facing: ${candLine(r, opp())}</p><ul class="plist">${pros}</ul>${T.locked == null && !S.done ? `<p class="muted small">No signature means a primary decides your nominee.</p>` : ""}</article>`;
  }).join("");
  let after = "";

  return `${stageHead("Recruit your candidates", `You have <b>${G.calls}</b> recruiting call${G.calls === 1 ? "" : "s"} left. Candidate quality is in points of margin; your forecast assumes a typical recruit (+1.0).`)}

/* ---------- fundraising ---------- */

function fundAmt(F) { const m = DIFF[G.diff].cash * (G.ch === "H" ? 0.85 : 1); let a = F.amt.slice(); if (F.base) { const k = 0.6 + G.meters.base / 100; a = a.map(x => x * k); } return a.map(x => Math.round(x * m)); }

/* ---------- primaries ---------- */
function rPrimary() {

  }

    const opts = P.party === G.p
      ? [["est", `Back ${P.est.n.split(" ")[1]} (${money(cost)})`], ["neutral", "Stay neutral"], ["ins", `Embrace ${P.ins.n.split(" ")[1]}`]]
      : [["meddle", `Boost their insurgent (${money(mcost)})`], ["out", "Stay out"]];
    return `<article class="rcard"><div class="rc-top"><div><h3>${esc(raceName(r))}</h3><span class="muted small">${PADJ[P.party]} primary. ${P.incumbent ? "An insurgent is challenging the incumbent." : esc(seatDesc(r)) + "."}</span></div><span class="pill">Insurgent ${pct(pIns(P))}</span></div>
      <ul class="plist"><li class="pros"><div><b>${esc(P.est.n)}</b> <span class="tag">${esc(P.est.tag)}</span> <span class="q ${P.est.q >= 0 ? "up" : "dn"}">${signed(P.est.q)}</span></div></li><li class="pros"><div><b>${esc(P.ins.n)}</b> <span class="tag">${esc(P.ins.tag)}</span> <span class="q dn">${signed(P.ins.q)}</span></div></li></ul>
      <div class="seg sm" role="group">${opts.map(([k, l]) => `<button class="${P.ch === k ? "on" : ""}" data-act="prim" data-k="${P.id}" data-c="${k}" aria-pressed="${P.ch === k}">${esc(l)}</button>`).join("")}</div>
      ${P.party !== G.p ? `<p class="muted small">Meddling adds 18 points to the insurgent's chances. One time in four it leaks (Swing −3).</p>` : `<p class="muted small">Backing a candidate moves their odds 20 points. Embracing the insurgent fires up your base (+2).</p>`}</article>`;
  };
  return `${stageHead("Primary season", "Establishment favorites against insurgents. Insurgents are stronger when your base is hot and your caucus is divided.")}
  ${own.length ? `<h2 class="h3">Your party's primaries</h2><div class="rgrid">${own.map(card).join("")}</div>` : ""}
  ${theirs.length ? `<h2 class="h3">Their primaries</h2><div class="rgrid">${theirs.map(card).join("")}</div>` : ""}`;
}
function primOdds(P) {
  let p;
  if (P.party === G.p) { p = P.incumbent ? 0.14 + 0.004 * (50 - G.meters.unity) : 0.34 + 0.004 * (G.meters.base - 50) + 0.005 * (50 - G.meters.unity) + (G.tone === "base" ? 0.05 : G.tone === "tent" ? -0.03 : 0); if (P.ch === "est") p -= 0.2; if (P.ch === "ins") p += 0.2; }
  else { p = P.incumbent ? 0.16 : 0.36; if (P.ch === "meddle") p += 0.18; }
  return clamp(p, 0.05, 0.9);
}

/* ---------- crisis and surprise ---------- */
function rEvent(kind) {
  const S = G.st[kind], ev = (kind === "crisis" ? CRISES : SURPRISES).find(e => e.k === S.k);
  const ctx = evCtx(ev, S);
  const title = ev.t, d = ev.d.replace("{race}", S.raceLbl || "a top race");
  const head = stageHead(kind === "crisis" ? "Summer crisis" : "October surprise", "");
  const autoTxt = ev.auto && fxList(ev.auto).length ? `<p class="muted small">Already happening: ${esc(fxStr(ev.auto))}</p>` : "";
  const evBox = `<section class="event"><h2>${esc(title)}</h2><p>${esc(d)}</p>${autoTxt}</section>`;
  const opts = evOpts(ev);
  if (S.pick != null) {
    const o = opts[S.pick];
    return head + evBox + resultBox(S.ok, S.ok ? "It worked" : "It backfired", o.n, [esc(fxStr(S.ok ? o.s : o.f, ctx))]);
  }
  const base = baseOdds();
  return head + evBox + `<div class="opts">${opts.map((o, i) => { const oo = Object.assign({}, o, { k: String(i) }); if (o.cost && G.cash < o.cost) return `<article class="opt dis"><div class="opt-top"><h3>${esc(o.n)}</h3></div><p class="opt-d">Not enough money (${money(o.cost)}).</p></article>`; return optCard(oo, "resp", base, ctx, o.cost ? `Costs ${money(o.cost)}` : ""); }).join("")}</div>`;
}
function evOpts(ev) {
  const pow = G.pres.party === G.p;
  return ev.o.filter(o => !o.who || (o.who === "pow") === pow).map(o => {
    const x = Object.assign({}, o, { s: Object.assign({}, o.s), f: Object.assign({}, o.f) });
    if (o.party && o.party[G.p]) { Object.assign(x.s, o.party[G.p].s || {}); Object.assign(x.f, o.party[G.p].f || {}); }
    x.pfix = clamp(o.p + DIFF[G.diff].odds, 0.08, 1);
    if (o.p >= 1) x.pfix = 1;
    return x;
  });
}
function evCtx(ev, S) { const c = {}; if (ev.sts) { c.sts = ev.sts; c.stsLabel = ev.sts.map(s => ST[s].n).slice(0, 3).join(", ") + (ev.sts.length > 3 ? " and nearby" : ""); } if (S.race) { c.race = S.race; c.raceLabel = S.raceLbl; } return c; }

  CA: [0, 4], UT: [1, 4], CO: [2, 4], NE: [3, 4], MO: [4, 4], KY: [5, 4], WV: [6, 4], VA: [7, 4], MD: [8, 4], DE: [9, 4],
  AZ: [1, 5], NM: [2, 5], KS: [3, 5], AR: [4, 5], TN: [5, 5], NC: [6, 5], SC: [7, 5],

const RD_LBL = ["Early", "Labor Day", "Final push"];
const MOE = k => (1.96 * (k === "pub" ? M.pubSd : M.intSd) / 2).toFixed(1);
function rtCls(pD) { const R = ratingOf(pD); return `rt-${R.k} ${R.lead}`; }

/* kind: "plan" (forecast ratings), "night" (calls as they come in), "final" (winners) */
function tileMap(kind, opts) {
  opts = opts || {};
  const f = kind === "plan" ? getFC() : null, i = G.night ? G.night.i : 0;
  const byState = {};
  G.races.forEach((r, j) => { (byState[r.st] = byState[r.st] || []).push({ r, j }); });
  const cellCls = (r, j) => {
    if (kind === "plan") return rtCls(f.rp[j]);
    if (kind === "final") return `fin ${r.w}${r.w !== r.hold ? " flip" : ""}`;
    if (r.call) return `call ${r.call}${r.call !== r.hold ? " flip" : ""}`;
    if (r.recount || (r.runoff && r.runoffShown)) return "closed";
    const rep = repAt(r, i); if (rep === null) return "wait"; if (rep === 0) return "closed";
    return `lead ${dispAt(r, i, rep) >= 0 ? "D" : "R"}`;
  };
  const sel = opts.sel;
  let out = "";
  for (const st in TILE) {
    const [c, rw] = TILE[st], list = byState[st], pos = `grid-column:${c + 1};grid-row:${rw + 1}`;
    if (!list) { out += `<span class="tl off" style="${pos}" aria-hidden="true">${st}</span>`; continue; }
    list.sort((a, b) => a.r.id < b.r.id ? -1 : 1);
    const spend = kind === "plan" && list.some(x => x.r.ad[G.p] || x.r.fl[G.p] || x.r.vis);
    const isSel = sel === st || (G.ch === "S" && sel === list[0].r.id);
    if (G.ch === "S") {
      const { r, j } = list[0], cls = cellCls(r, j);
      const mw = kind === "plan" ? Math.round(myWin(f.rp[j]) * 100) : 0;
      const sub = kind === "plan" ? (mw >= 99 || mw <= 1 ? "" : mw) : kind === "night" ? (r.call ? (r.c[r.call].ind ? "I" : r.call) : (repAt(r, i) === null ? "" : repAt(r, i) + "%")) : `${r.c[r.w].ind ? "I" : r.w}+${Math.round(Math.abs(r.fin))}`;
      const lab = `${ST[st].n}${kind === "plan" ? `, ${ratingOf(f.rp[j]).l}, your odds ${pct(myWin(f.rp[j]))}` : ""}`;
      out += `<button class="tl ${cls}${isSel ? " sel" : ""}" style="${pos}" data-act="${opts.act || "sel"}" data-k="${st}" aria-label="${esc(lab)}" aria-pressed="${isSel}"><b>${st}</b><small>${sub}</small>${spend ? `<i class="spend"></i>` : ""}</button>`;
    } else {
      const cells = list.map(({ r, j }) => `<i class="${cellCls(r, j)}" title="${r.id}"></i>`).join("");
      out += `<button class="tl hs${isSel ? " sel" : ""}" style="${pos}" data-act="${opts.act || "sel"}" data-k="${st}" aria-label="${esc(ST[st].n)}, ${list.length} battleground district${list.length > 1 ? "s" : ""}" aria-pressed="${isSel}"><b>${st}</b><span class="dg">${cells}</span>${spend ? `<i class="spend"></i>` : ""}</button>`;
    }
  }
  return `<div class="tmap" role="group" aria-label="Map of races">${out}</div>`;
}
